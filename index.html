<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="./img/pokeballfavicon.png" />
        <script src="script.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="responsive.css" />
        <link rel="stylesheet" href="colors.css" />
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
        <!--sweet alert function-->
        <title>Pokedex</title>
    </head>

    <body onload="loadPokemons()">
        <header id="pokemonheader">
            <div>
                <img class="headerimg" src="./img/pokedex.png" />
            </div>
            <div>
                <form>
                    <input class="searching" type="text" id="search" placeholder=" ...search for Pokemon"/>
                    <button class="searching1" onclick="filterNames(event)">Go!</button>
                </form>
            </div>
        </header>

        <div class="main-container" id="main-container"></div>

        <div class="main-detail-container d-none" id="main-detail-container">
            <div class="pokemon-details d-none" id="pokemon-details"></div>
        </div>

        <div id="loadmore" class="lomopo">
            <img class="loadmorePokemon" src="./img/loadmorepokemon.png" onclick="loadMore()"/>
        </div>
    </body>
</html>
